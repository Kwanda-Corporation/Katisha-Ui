# CD: build the SPA with production env baked in, push to Docker Hub, and deploy to the VPS over SSH.
# Triggers: push to main, version tags (v*), or manual dispatch.
#
# Required GitHub repository secrets:
#   SSH_HOST          — VPS hostname/IP
#   SSH_USERNAME      — SSH user (must be able to run docker)
#   SSH_PRIVATE_KEY   — *** UPDATED: Put your plain text password here ***
# Optional secrets:
#   SSH_PORT          — default 22
#   DEPLOY_PATH       — directory on the server, default /opt/katisha-web
#   DOCKERHUB_TOKEN  — Docker Hub personal access token for pushing images
#   GHCR_USERNAME     — GitHub username owning that PAT
#   VITE_API_URL      — API base URL baked into the bundle, default https://api.katisha.today/api
#   VITE_GOOGLE_CLIENT_ID — Google OAuth client ID (falls back to frontend/.env if set)
#   VITE_MAPBOX_TOKEN — optional Mapbox token (falls back to the hardcoded default)
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.full-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image name (Docker Hub)
        id: image
        run: echo "name=docker.io/ashraftuyubahe001160/katisha-ui" >> "$GITHUB_OUTPUT"

      - name: Compute full image reference
        id: full-image
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "image=docker.io/ashraftuyubahe001160/katisha-ui:${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "image=docker.io/ashraftuyubahe001160/katisha-ui:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ashraftuyubahe001160
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/ashraftuyubahe001160/katisha-ui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || 'https://api.katisha.today/api' }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/katisha-web' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload compose file and deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}  # <-- Uses value as password
          source: "docker-compose.web.yml,deploy.sh"
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}  # <-- Uses value as password
          envs: DOCKERHUB_TOKEN,GHCR_USERNAME,DEPLOY_PATH,FRONTEND_IMAGE
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "========================================="
            echo ">>> FRONTEND DEPLOY START"
            echo ">>> HOST=$(hostname)"
            echo ">>> DATE=$(date -Is)"
            echo ">>> WHOAMI=$(whoami)"
            echo ">>> DEPLOY_PATH=$DEPLOY_PATH"
            echo ">>> GHCR_USERNAME=$GHCR_USERNAME"
            echo ">>> FRONTEND_IMAGE=$FRONTEND_IMAGE"
            echo ">>> DOCKER_VERSION=$(docker --version)"
            echo ">>> COMPOSE_VERSION=$(docker compose version || echo 'compose plugin missing')"
            echo ">>> GHCR_PAT length=${#DOCKERHUB_TOKEN}"
            echo "========================================="

            echo ">>> Pre-login docker info:"
            docker info 2>&1 | grep -i 'Username\|Registry\|Server' || true

            echo ">>> Compose config dump:"
            docker compose -f "docker-compose.web.yml" config 2>&1 || true

            # Authenticate to Docker Hub when the image is private (skip for public repos).
            if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              echo ">>> Attempting docker logout (clean slate)..."
              echo "$DOCKERHUB_TOKEN" | docker logout docker.io || true
              echo ">>> Attempting docker login with retry..."
              for i in 1 2 3; do
                echo ">>> Docker login attempt $i/3"
                if echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$GHCR_USERNAME" --password-stdin; then
                  echo ">>> Docker Hub login succeeded on attempt $i"
                  break
                fi
                echo ">>> Docker login attempt $i failed, retrying in 15s..."
                sleep 15
              done
              echo ">>> Post-login docker info:"
              docker info 2>&1 | grep -i 'Username\|Registry\|Server' || true
            else
              echo ">>> No DOCKERHUB_TOKEN provided, skipping docker login"
            fi
            echo "========================================="
            export FRONTEND_IMAGE="${FRONTEND_IMAGE}"
            chmod +x deploy.sh
            bash deploy.sh
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
