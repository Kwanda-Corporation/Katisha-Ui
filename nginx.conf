server {
  listen 80;
  server_name _;

  # Docker embedded DNS: resolve the "api" upstream at request time so the
  # web container starts safely even if the API container is not yet up.
  resolver 127.0.0.11 ipv6=off valid=10s;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.katisha.today wss://api.katisha.today https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; frame-src https://accounts.google.com;" always;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  client_max_body_size 10m;

  # Hashed build assets are immutable — cache aggressively.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The SPA entry must never be cached so new deployments propagate instantly.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Service worker + manifest must never be cached, or PWA updates break.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location = /site.webmanifest {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # API, uploads, and realtime traffic proxied to the API container
  # (same docker project network — service name "api" resolves via Docker DNS).
  location /api/ {
    set $api_upstream http://api:5001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /uploads/ {
    set $api_upstream http://api:5001;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  location /socket.io/ {
    set $api_upstream http://api:5001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /health {
    set $api_upstream http://api:5001;
    proxy_pass $api_upstream;
  }

  # SPA history fallback — all client routes served from index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
