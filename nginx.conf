server {
  listen 80;
  server_name _;

  # Keep redirects relative so they preserve the request host/scheme (nginx
  # otherwise rewrites them to http://<host>/, downgrading https and adding an
  # extra hop for crawlers).
  absolute_redirect off;

  # Docker embedded DNS: resolve the "api" upstream at request time so the
  # web container starts safely even if the API container is not yet up.
  resolver 127.0.0.11 ipv6=off valid=10s;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers (see security-headers.conf - also included by the
  # locations below, because add_header does not inherit).
  include /etc/nginx/conf.d/security-headers.inc;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  client_max_body_size 10m;

  # Hashed build assets are immutable - cache aggressively.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Homepage: exact match so it is never treated as a directory (which would
  # 301 to "/"). Never cached so new deployments propagate instantly.
  location = / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /index.html =404;
  }

  # SPA fallback shell (noindex) for client-only routes with no pre-rendered
  # file. Never cached so new deployments propagate instantly.
  location = /spa.html {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # The SPA entry must never be cached so new deployments propagate instantly.
  location = /index.html {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Service worker + manifest must never be cached, or PWA updates break.
  location = /sw.js {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }
  location = /site.webmanifest {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # API, uploads, and realtime traffic proxied to the API container
  # (same docker project network - service name "api" resolves via Docker DNS).
  location /api/ {
    set $api_upstream http://api:5001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /uploads/ {
    set $api_upstream http://api:5001;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  location /socket.io/ {
    set $api_upstream http://api:5001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /health {
    set $api_upstream http://api:5001;
    proxy_pass $api_upstream;
  }

  # Directory-style pre-rendered pages (/bus/…, /agency/…, /guide, /privacy, …)
  # are emitted as <route>/index.html. Resolving them with $uri/index.html
  # serves the file at the requested URL, so the served URL, the sitemap <loc>
  # and the page's rel=canonical all agree and no redirect is needed.
  #
  # SPA history fallback for every other client route (dashboard, auth,
  # /book?…, via-town variants, unknown paths) uses the noindex shell so those
  # URLs are not seen as duplicates of the homepage.
  location / {
    # Collapse the non-canonical trailing-slash form (/bus/rwanda/ -> /bus/rwanda)
    # onto the canonical, sitemap URL instead of nginx's default reverse
    # (which made every sitemap URL a 301).
    if ($uri ~ ^/(.*)/$) {
      return 301 /$1$is_args$args;
    }
    try_files $uri/index.html $uri /spa.html;
  }
}
