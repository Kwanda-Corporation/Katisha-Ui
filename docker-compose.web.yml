services:
  web:
    image: ${FRONTEND_IMAGE:-docker.io/ashraftuyubahe001160/katisha-ui:latest}
    container_name: katisha-web 
    restart: unless-stopped
    ports:
      - "0.0.0.0:5002:80"  # Expose host port 5002 to container port 80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s